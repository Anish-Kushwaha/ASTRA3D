name: ASTRA3D CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  database-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astra_test
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prepare minimal Supabase-compatible test objects
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;

          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;

          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            public boolean NOT NULL DEFAULT false
          );
          CREATE TABLE storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text NOT NULL REFERENCES storage.buckets(id),
            name text NOT NULL,
            UNIQUE (bucket_id, name)
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;

          CREATE OR REPLACE FUNCTION storage.foldername(name text)
          RETURNS text[]
          LANGUAGE sql
          IMMUTABLE
          AS $$
            SELECT CASE
              WHEN position('/' in name) = 0 THEN ARRAY[]::text[]
              ELSE ARRAY[split_part(name, '/', 1)]
            END;
          $$;

          GRANT USAGE ON SCHEMA auth, storage TO authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON storage.objects TO authenticated;
          SQL
      - name: Verify canonical schema and migration stay synchronized
        run: cmp supabase/schema.sql supabase/migrations/20261120120000_astra3d_initial_schema.sql
      - name: Apply migration twice to verify idempotency
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261120120000_astra3d_initial_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261120120000_astra3d_initial_schema.sql
      - name: Verify project isolation, roles and storage policies
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/schema_smoke.sql

  web:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install browser Studio dependencies
        run: cd web && npm install
      - name: Audit browser Studio dependencies
        run: cd web && npm audit --audit-level=high
      - name: Run tests and production bundle
        run: cd web && npm run build
